<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset — Poxpur Sales Hub</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f5f7fa;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .card {
        background: #fff;
        border-radius: 16px;
        padding: 40px;
        max-width: 440px;
        box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        text-align: center;
      }
      .logo {
        width: 64px;
        height: 64px;
        background: #8BC53F;
        border-radius: 14px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
        font-size: 32px;
        color: white;
        font-weight: 900;
      }
      h1 { color: #1B2C5E; font-size: 22px; margin: 0 0 8px; }
      p { color: #6B7280; font-size: 14px; line-height: 1.6; margin: 0 0 24px; }
      .status {
        background: #f5f7fa;
        border-radius: 8px;
        padding: 12px;
        font-family: monospace;
        font-size: 12px;
        text-align: left;
        margin-bottom: 24px;
        max-height: 200px;
        overflow-y: auto;
      }
      .status p { margin: 4px 0; color: #1B2C5E; }
      button {
        background: linear-gradient(135deg, #8BC53F, #6BA02F);
        color: white;
        border: none;
        padding: 14px 32px;
        font-size: 15px;
        font-weight: 700;
        border-radius: 12px;
        cursor: pointer;
        margin: 4px;
      }
      button:hover { opacity: 0.9; }
      .secondary {
        background: #1B2C5E;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">X</div>
      <h1>Resetando o aplicativo…</h1>
      <p>Limpando Service Worker e caches do navegador.<br>Não feche essa página.</p>
      <div class="status" id="log"></div>
      <button onclick="location.href='/'">Voltar pro app</button>
      <button class="secondary" onclick="runReset()">Limpar de novo</button>
    </div>
    <script>
      var log = document.getElementById('log');
      function add(msg) {
        var p = document.createElement('p');
        p.textContent = msg;
        log.appendChild(p);
        log.scrollTop = log.scrollHeight;
      }
      async function runReset() {
        log.innerHTML = '';
        add('Iniciando reset…');
        try {
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            add('Service workers encontrados: ' + regs.length);
            for (var i = 0; i < regs.length; i++) {
              await regs[i].unregister();
              add('  ✓ desregistrado #' + (i + 1));
            }
          }
          if ('caches' in window) {
            var keys = await caches.keys();
            add('Caches encontrados: ' + keys.length);
            for (var i = 0; i < keys.length; i++) {
              await caches.delete(keys[i]);
              add('  ✓ removido: ' + keys[i]);
            }
          }
          add('');
          add('PRONTO. Limpe localStorage manualmente se necessário.');
          add('Volte pra raiz (botão acima).');
        } catch (e) {
          add('ERRO: ' + e.message);
        }
      }
      runReset();
    </script>
  </body>
</html>
